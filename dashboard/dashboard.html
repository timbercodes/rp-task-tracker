<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Task Tracker</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- ==========================================
         VIEW 1: ONBOARDING & SETTINGS
         Displayed to new users or when 'Settings' is clicked.
         Handles forum configuration and character lists.
         ========================================== -->
    <main id="onboarding-view" class="view-container">
        <div class="onboarding-card">
            <h1>Добро пожаловать в трекер! 🎲</h1>
            <p>Давай добавим твои форумы, чтобы настроить доску.</p>

            <!-- Forum Input Form -->
            <div class="form-group">
                <input type="text" id="forum-name" placeholder="Название форума (например, Example RPG)">
                
                <input type="text" id="forum-url" placeholder="Ссылка (например, example-rpg.rusff.me)">
                <small class="hint">Нужно, чтобы расширение понимало, где показывать кнопку добавления долга.</small>
                
                <input type="text" id="forum-chars" placeholder="Твои персонажи (через запятую, например: John Doe, Jane)">
                
                <button id="btn-add-forum" class="primary-btn">Добавить форум</button>
            </div>

            <!-- Dynamic List of Saved Forums -->
            <div id="added-forums-list" class="forums-list"></div>

            <!-- Action Buttons -->
            <div id="onboarding-actions" style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="btn-cancel-settings" class="secondary-btn" style="flex: 1; display: none;">Отмена</button>
                <button id="btn-finish-onboarding" class="success-btn" style="flex: 2; margin-top: 0;" disabled>Перейти к доске</button>
            </div>
        </div>
    </main>

    <!-- ==========================================
         VIEW 2: MAIN KANBAN BOARD
         The primary workspace displaying tasks sorted by forums.
         ========================================== -->
    <main id="kanban-view" class="view-container" style="display: none;">
        <header>
            <h1>Мои долги</h1>
            <button id="btn-settings" class="secondary-btn"></button>
        </header>

        <!-- Kanban Columns Container (Generated via JS) -->
        <div class="board" id="main-board"></div>
    </main>

    <!-- ==========================================
         MODALS & OVERLAYS
         ========================================== -->
    
    <!-- Task Edit Modal -->
    <div id="task-edit-modal" class="modal-overlay" style="display: none;">
        <div class="onboarding-card" style="width: 350px; padding: 25px;">
            <h3 style="margin-bottom: 15px;">Редактировать долг</h3>
            <div class="form-group" style="gap: 10px;">
                <input type="text" id="edit-task-title" placeholder="Название темы">
                <input type="text" id="edit-task-char" placeholder="Персонаж">
                <select id="edit-task-type" style="padding: 10px; background: var(--bg-color); color: white; border: 1px solid var(--border); border-radius: 6px;">
                    <option value="wait">Жду ответа</option>
                    <option value="deadline">Дедлайн</option>
                </select>
                <input type="date" id="edit-task-date">
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button id="btn-cancel-edit" class="secondary-btn" style="flex: 1;">Отмена</button>
                    <button id="btn-save-task-edit" class="primary-btn" style="flex: 1;">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts must be loaded at the end of the body -->
    <script src="dashboard.js"></script>
    
</body>
</html>
